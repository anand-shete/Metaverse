name: CD Backend

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/CI-api.yml"
      - ".github/workflows/CD-api.yml"

concurrency:
  group: cd-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/CI-api.yml

  deploy:
    name: CD
    needs: ci
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: metaverse/api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build \
            -f apps/api/Dockerfile \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Copy compose and deploy script to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "apps/api/compose.yml,apps/api/deploy.sh"
          target: "/home/${{ secrets.EC2_USER }}/metaverse/"
          strip_components: 2

      - name: Pull image and restart stack on EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_PROFILE: metaverse-ecr-user
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # passes variables and export inside EC2 server
          envs: ECR_REGISTRY,IMAGE_TAG,AWS_REGION,AWS_PROFILE
          script: |
            set -euo pipefail
            cd "/home/${{ secrets.EC2_USER }}/metaverse"
            chmod +x deploy.sh
            export ECR_REGISTRY IMAGE_TAG AWS_REGION AWS_PROFILE
            ./deploy.sh
